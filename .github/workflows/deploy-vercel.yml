# Deploy automático para a Vercel a cada push a este branch.
#
# Para ATIVAR (uma vez), adiciona 3 segredos no GitHub em
# Settings → Secrets and variables → Actions → New repository secret:
#   VERCEL_TOKEN       (Vercel → Account Settings → Tokens → Create)
#   VERCEL_ORG_ID      (está em .vercel/project.json no teu Mac, campo "orgId")
#   VERCEL_PROJECT_ID  (está em .vercel/project.json no teu Mac, campo "projectId")
#
# A partir daí, cada push faz deploy sozinho — não precisas do terminal.
# (Se já tiveres a integração Git da Vercel ligada no dashboard, NÃO
#  precisas disto — apaga este ficheiro para não haver deploys duplicados.)

name: Deploy to Vercel

on:
  push:
    branches:
      - claude/expense-tracker-setup-6lgkg4
  workflow_dispatch: {} # permite disparar manualmente no separador Actions

concurrency:
  group: vercel-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel project settings (inclui variáveis de ambiente)
        run: vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Build
        run: vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Deploy (produção)
        run: vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}"
